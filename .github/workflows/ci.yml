name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Elm build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check Elm formatting
        run: npm run format:check --prefix frontend

      - name: Build Elm frontend
        run: npm run build

      - name: Run Elm tests
        run: npm run test:frontend

  backend:
    name: Haskell build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memory_diary
          POSTGRES_PASSWORD: memory_diary
          POSTGRES_DB: memory_diary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client pkg-config

      - name: Install fourmolu
        run: |
          curl -sL https://github.com/fourmolu/fourmolu/releases/download/v0.14.0.0/fourmolu-0.14.0.0-linux-x86_64 -o /usr/local/bin/fourmolu
          chmod +x /usr/local/bin/fourmolu

      - name: Check Haskell formatting
        working-directory: backend
        run: fourmolu --mode check src test app

      - name: Cache Stack global packages
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-global-${{ hashFiles('backend/stack.yaml', 'backend/package.yaml') }}
          restore-keys: stack-global-

      - name: Cache .stack-work
        uses: actions/cache@v4
        with:
          path: backend/.stack-work
          key: stack-work-${{ hashFiles('backend/stack.yaml', 'backend/package.yaml', 'backend/src/**/*.hs', 'backend/test/**/*.hs') }}
          restore-keys: stack-work-

      - name: Build (dependencies only)
        working-directory: backend
        run: stack build --install-ghc --only-dependencies

      - name: Build
        working-directory: backend
        run: stack build

      - name: Run tests
        working-directory: backend
        run: stack test
        env:
          TEST_DATABASE_URL: postgresql://memory_diary:memory_diary@localhost:5432/memory_diary_test

      - name: Generate Haddock documentation
        working-directory: backend
        run: stack haddock --no-haddock-deps
