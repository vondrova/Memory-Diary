name:                backend
version:             0.1.0.0
github:              "vondrve/Memory-Diary"
license:             BSD-3-Clause
author:              "Veronika Vondrová"
maintainer:          "vondrve@gmail.com"
copyright:           "2026 Veronika Vondrová"
synopsis:            "Haskell backend for Memory Diary"

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- directory
- filepath
- monad-logger
- mtl
- persistent
- persistent-sqlite
- servant
- servant-multipart
- servant-server
- text
- time
- wai
- wai-app-static
- warp

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  backend-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - backend
